name: Update optimizer image tag

permissions:
  contents: write

on:
  schedule:
    - cron: '0 * * * *'  # stündlich, Minute 0 (UTC)
  workflow_dispatch:

jobs:
  update-evopt:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Get newest evcc/optimizer tag from Docker Hub
        id: get_tag
        run: |
          tag=$(curl -s "https://hub.docker.com/v2/repositories/evcc/optimizer/tags?page_size=100" | jq -r '
            .results
            | map(select(.name != "latest"))
            | sort_by(.tag_last_pushed)
            | last
            | .name
          ')
          if [ -z "$tag" ] || [ "$tag" = "null" ]; then
            echo "Failed to resolve newest tag" >&2
            exit 1
          fi
          echo "Newest tag: $tag"
          echo "tag=$tag" >> $GITHUB_OUTPUT

      - name: Get current version from config.yaml
        id: current_version
        run: |
          current_version=$(grep -oP '^version:\s*"\K[^"]+' evopt/config.yaml)
          echo "Current version: $current_version"
          echo "current_version=$current_version" >> $GITHUB_OUTPUT

      - name: Update config.yaml if the tag changed
        id: compare_and_update
        run: |
          if [ "${{ steps.get_tag.outputs.tag }}" = "${{ steps.current_version.outputs.current_version }}" ]; then
            echo "No update needed"
            echo "updated=false" >> $GITHUB_OUTPUT
          else
            echo "Updating config.yaml to ${{ steps.get_tag.outputs.tag }}"
            sed -i "s/^version:.*/version: \"${{ steps.get_tag.outputs.tag }}\"/" evopt/config.yaml
            echo "updated=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push changes if updated
        if: steps.compare_and_update.outputs.updated == 'true'
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: Update evcc/optimizer image to ${{ steps.get_tag.outputs.tag }}
          branch: main
