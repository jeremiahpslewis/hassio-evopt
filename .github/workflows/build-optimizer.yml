name: Build optimizer image

on:
  schedule:
    - cron: '0 * * * *'  # stündlich, Minute 0 (UTC)
  workflow_dispatch:

# never let two runs race on the version bump commit or the image tags
concurrency:
  group: optimizer-update
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/evopt

jobs:
  build-optimizer:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: main

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine required build
        id: plan
        run: |
          upstream=$(git ls-remote https://github.com/evcc-io/optimizer.git refs/heads/main | cut -f1)
          if [ -z "$upstream" ]; then
            echo "Failed to resolve upstream main" >&2
            exit 1
          fi
          pinned=$(grep -oP 'EVOPT_COMMIT:\s*"\K[0-9a-f]+' evopt/build.yaml)
          current=$(grep -oP '^version:\s*"\K[^"]+' evopt/config.yaml)
          echo "upstream=$upstream pinned=$pinned current=$current"
          if [ "$upstream" != "$pinned" ]; then
            today=$(date -u +%Y.%-m.%-d)
            if [ "$current" = "$today" ]; then
              new="$today.1"
            elif [[ "$current" == "$today".* ]]; then
              new="$today.$(( ${current##*.} + 1 ))"
            else
              new="$today"
            fi
            echo "New upstream commit, building version $new"
            echo "build=true" >> $GITHUB_OUTPUT
            echo "bump=true" >> $GITHUB_OUTPUT
            echo "commit=$upstream" >> $GITHUB_OUTPUT
            echo "version=$new" >> $GITHUB_OUTPUT
          elif ! docker manifest inspect "$IMAGE:$current" > /dev/null 2>&1; then
            echo "Image tag $current missing on GHCR, building it"
            echo "build=true" >> $GITHUB_OUTPUT
            echo "bump=false" >> $GITHUB_OUTPUT
            echo "commit=$pinned" >> $GITHUB_OUTPUT
            echo "version=$current" >> $GITHUB_OUTPUT
          else
            echo "Up to date"
            echo "build=false" >> $GITHUB_OUTPUT
          fi

      - name: Update build.yaml and config.yaml
        if: steps.plan.outputs.bump == 'true'
        run: |
          sed -i "s/^\(\s*EVOPT_COMMIT:\).*/\1 \"${{ steps.plan.outputs.commit }}\"/" evopt/build.yaml
          sed -i "s/^version:.*/version: \"${{ steps.plan.outputs.version }}\"/" evopt/config.yaml

      - name: Set up QEMU
        if: steps.plan.outputs.build == 'true'
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - name: Set up Docker Buildx
        if: steps.plan.outputs.build == 'true'
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      # publish only the immutable SHA tag here; the user-facing version tag
      # follows after the matching config commit is safely on main
      - name: Build and push SHA-tagged image
        if: steps.plan.outputs.build == 'true'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: evopt
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            EVOPT_COMMIT=${{ steps.plan.outputs.commit }}
          tags: |
            ${{ env.IMAGE }}:${{ steps.plan.outputs.commit }}

      - name: Commit and push version bump
        if: steps.plan.outputs.bump == 'true'
        uses: stefanzweifel/git-auto-commit-action@4a55954c782fc1ea30b9056cd3e7a2b40ca8887d # v7.2.0
        with:
          branch: main
          commit_message: Update optimizer to ${{ steps.plan.outputs.commit }} (${{ steps.plan.outputs.version }})
          file_pattern: 'evopt/build.yaml evopt/config.yaml'

      - name: Publish version tag
        if: steps.plan.outputs.build == 'true'
        run: docker buildx imagetools create -t "$IMAGE:${{ steps.plan.outputs.version }}" "$IMAGE:${{ steps.plan.outputs.commit }}"
