name: Sync add-on upstream

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/sync-upstream.yml
      - scripts/sync_addon_upstream.py
      - tests/test_sync_addon_upstream.py

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Test upstream sync with local Git repositories
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 -m unittest discover -s tests -v

  sync:
    if: github.event_name == 'workflow_dispatch' && github.ref_name == github.event.repository.default_branch
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: sync-addon-upstream
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
      - name: Mirror upstream and open or refresh the sync PR
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # Continue using the reviewed script when it checks out the PR branch.
          cp scripts/sync_addon_upstream.py "$RUNNER_TEMP/sync_addon_upstream.py"
          python3 "$RUNNER_TEMP/sync_addon_upstream.py" --repository "$GITHUB_REPOSITORY" --base "$BASE_BRANCH"
